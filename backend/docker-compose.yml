services:
  db:
    image: postgres:16-alpine
    container_name: stonetrail-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stonetrail
      POSTGRES_PASSWORD: stonetrail
      POSTGRES_DB: stonetrail
    ports:
      - "5432:5432"
    volumes:
      - stonetrail_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stonetrail -d stonetrail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stonetrail_pg:

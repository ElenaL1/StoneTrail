name: CI/CD

on:
  push:
    branches: [main]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://stonetrail:stonetrail@127.0.0.1:5432/stonetrail
      AUTH_DEBUG_LINKS: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stonetrail
          POSTGRES_PASSWORD: stonetrail
          POSTGRES_DB: stonetrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stonetrail -d stonetrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest -ra --tb=short

  build:
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/stonetrail-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/stonetrail-frontend:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/stonetrail-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/stonetrail-backend:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          BACKEND_IMAGE_TAG: ${{ github.sha }}
          FRONTEND_IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          mkdir -p "$HOME/stonetrail/infra"
          cp infra/docker-compose.yaml infra/nginx.conf "$HOME/stonetrail/infra/"
          cd "$HOME/stonetrail/infra"
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker compose pull frontend backend
          docker compose up -d

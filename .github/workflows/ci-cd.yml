name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://stonetrail:stonetrail@127.0.0.1:5432/stonetrail
      AUTH_DEBUG_LINKS: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stonetrail
          POSTGRES_PASSWORD: stonetrail
          POSTGRES_DB: stonetrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stonetrail -d stonetrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest -ra --tb=short

  build:
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase GHCR owner
        run: echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/stonetrail-frontend:latest
            ghcr.io/${{ env.GHCR_OWNER }}/stonetrail-frontend:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/stonetrail-backend:latest
            ghcr.io/${{ env.GHCR_OWNER }}/stonetrail-backend:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE_TAG: ${{ github.sha }}
          FRONTEND_IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          retry() {
            local attempt=1
            local max=5
            local delay=20
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "failed after ${max} attempts: $*"
                return 1
              fi
              echo "attempt ${attempt} failed, retrying in ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }
          login_ghcr() {
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          }
          export GHCR_OWNER=$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')
          mkdir -p "$HOME/stonetrail/infra"
          cp infra/docker-compose.yaml infra/nginx.conf "$HOME/stonetrail/infra/"
          cd "$HOME/stonetrail/infra"
          retry login_ghcr
          retry docker compose pull frontend
          retry docker compose pull backend
          if ! docker compose up -d --wait --wait-timeout 180 --force-recreate frontend backend nginx; then
            docker compose ps -a
            docker compose logs --tail=120
            exit 1
          fi
          docker compose ps
          curl -sf --max-time 10 http://127.0.0.1:8080/health

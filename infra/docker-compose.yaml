services:
  frontend:
    container_name: frontend
    image: ${DOCKER_USERNAME}/stonetrail-frontend:latest
    restart: always
    expose:
      - "3000"

  # Пока backend не нужен

  nginx:
    image: nginx:1.21.3-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend

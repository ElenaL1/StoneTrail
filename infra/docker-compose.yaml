services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stonetrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-stonetrail}
    volumes:
      - stonetrail_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-stonetrail} -d ${POSTGRES_DB:-stonetrail}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: backend
    image: ghcr.io/${GHCR_OWNER:-elenal1}/stonetrail-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: always
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stonetrail}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stonetrail}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://stonetrail.ru,https://www.stonetrail.ru}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AUTH_DEBUG_LINKS: ${AUTH_DEBUG_LINKS:-false}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://stonetrail.ru}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1126}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-StoneTrail}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: frontend
    image: ghcr.io/${GHCR_OWNER:-elenal1}/stonetrail-frontend:${FRONTEND_IMAGE_TAG:-latest}
    restart: always
    expose:
      - "3000"
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.21.3-alpine
    container_name: nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  stonetrail_pg:

# Системный nginx на VPS (порты 80/443 + Let's Encrypt).
# Контейнер StoneTrail остаётся на 8080; этот файл только проксирует домен туда.
#
# Установка на сервере:
#   sudo cp host-nginx-stonetrail.conf /etc/nginx/sites-available/stonetrail.ru
#   sudo ln -sf /etc/nginx/sites-available/stonetrail.ru /etc/nginx/sites-enabled/stonetrail.ru
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name stonetrail.ru www.stonetrail.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stonetrail.ru www.stonetrail.ru;

    ssl_certificate /etc/letsencrypt/live/stonetrail.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stonetrail.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
